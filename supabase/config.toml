
[functions.create_live_room]
enabled = true
# verify_jwt false matches PRODUCTION: the function authenticates internally
# (getUser) and must answer the unauthenticated CORS preflight itself.
verify_jwt = false
import_map = "./functions/create_live_room/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create_live_room/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create_live_room/*.html" ]

