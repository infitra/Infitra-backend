[functions.precreate_rooms]
enabled = true
# verify_jwt false matches PRODUCTION. The function authenticates via the
# x-cron-secret shared header (CRON_SECRET function secret = Vault
# precreate_cron_secret), invoked every minute by the pg_cron job
# precreate-rooms. The earlier "no internal auth" note here was wrong: the
# header check existed all along, the audit grep just missed it.
verify_jwt = false
import_map = "./functions/precreate_rooms/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/precreate_rooms/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/precreate_rooms/*.html" ]

[functions.email_outbox_drain]
enabled = true
# Invoked by the drain-email-outbox pg_cron job with the anon JWT from Vault,
# so platform JWT verification stays on. Replaces email_send_receipt (the
# outbox outgrew receipts; this drains every kind).
verify_jwt = true
import_map = "./functions/email_outbox_drain/deno.json"
entrypoint = "./functions/email_outbox_drain/index.ts"

